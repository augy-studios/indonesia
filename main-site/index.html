    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9715826188316382"
        crossorigin="anonymous"></script>

    <meta property="og:site_name" content="UwU Apps" />
    <meta property="og:description" content="Can is can, but in Indonesia! A directory of small, free Indonesia-focused tools." />

    <script>
        (function () {
            try {
                var k = "idb";
                var m = localStorage.getItem(k + ".mode") || "light";
                var c = localStorage.getItem(k + ".colorTheme") || "classic";
                document.documentElement.setAttribute("data-mode", m);
                document.documentElement.setAttribute("data-color-theme", c);
            } catch (e) {
                document.documentElement.setAttribute("data-mode", "light");
                document.documentElement.setAttribute("data-color-theme", "classic");
            }
        })();
    </script>

    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/index.css">
    <meta name="theme-color" content="#ccffcc" />

    <!-- Embed Image -->
    <link rel="apple-touch-icon" href="/IDB-main.png">
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image:src" content="/IDB-main.png">
    <meta property="og:image" content="/IDB-main.png" />
</head>

<body>
    <header class="site-header">
        <a class="brand" href="/">
            <img src="/IDB-192.png" alt="" width="32" height="32">
            <span>Indonesia Bisa</span>
        </a>
        <div class="header-actions">
            <a class="icon-btn coffee-btn" href="https://donate.stripe.com/28o2akeAr3hv0DK6oo" target="_blank"
                rel="noopener noreferrer" aria-label="Buy Augy a coffee (opens in a new tab)">
                <span id="icon-coffee"></span>
                <span class="btn-label">Buy Augy a coffee</span>
            </a>
            <button type="button" id="themeBtn" class="icon-btn square" aria-haspopup="dialog"
                aria-label="Theme">
                <span data-icon="sun"></span>
            </button>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Indonesia Bisa</h1>
            <p>A small directory of free, Indonesia-focused tools and data.</p>
        </section>

        <div class="search-wrap glass">
            <span id="icon-search"></span>
            <input type="search" id="page-search" placeholder="Search pages…" aria-label="Search pages"
                autocomplete="off">
        </div>

        <div class="page-grid" id="page-grid"></div>

        <div class="no-results" id="no-results">
            <span id="icon-inbox"></span>
            <p>No pages match your search.</p>
        </div>
    </main>

    <footer class="footer">
        Indonesia Bisa is an independent project, not affiliated with BMKG or the Indonesian government.
    </footer>

    <!-- Theme picker modal -->
    <div class="modal-backdrop hidden" id="themeModal">
        <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle">
            <div class="modal-head">
                <h2 id="themeModalTitle">Theme</h2>
                <button type="button" class="icon-btn square small" data-close-modal="themeModal"
                    aria-label="Close">
                    <span data-icon="close"></span>
                </button>
            </div>
            <p class="modal-section-label">Mode</p>
            <div class="mode-toggle" id="modeToggle">
                <button class="mode-btn" type="button" data-mode="light" aria-pressed="false">
                    <span data-icon="sun"></span>Light
                </button>
                <button class="mode-btn" type="button" data-mode="dark" aria-pressed="false">
                    <span data-icon="moon"></span>Dark
                </button>
            </div>
            <p class="modal-section-label">Brand colour</p>
            <div class="swatch-grid" id="swatchGrid"></div>
        </div>
    </div>

    <script src="/js/icons.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/index.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>

</html>
